<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运动日志整体架构</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #131313;
      --panel: #1c1c1c;
      --ink: #f5f5f5;
      --muted: #b5b5b5;
      --soft: #8a8a8a;
      --line: #353535;
      --accent: #fc4c02;
      --accent-soft: #ff8a4c;
      --font-sans: 'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Iowan Old Style', 'Palatino Linotype', 'Songti SC', 'SimSun', serif;
      --font-mono: 'Cascadia Mono', Consolas, ui-monospace, monospace;
    }

    body {
      min-height: 100vh;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }

    .frame { width: 100%; max-width: 1200px; margin: 0 auto; min-width: 0; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 24px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 2.4vw + 1rem, 2.25rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture / Activity journal</p>
    <h1>运动日志整体架构</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="activity-architecture-title activity-architecture-desc">
        <title id="activity-architecture-title">运动日志整体架构</title>
        <desc id="activity-architecture-desc">架构图展示 Strava、Intervals.icu 与 COROS 组数进入云端同步流水线，经 Cloudflare Worker、Durable Object 和 GitHub Actions 处理后发布到 GitHub Pages，再由浏览器展示。</desc>
        <defs>
          <marker id="activity-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#b5b5b5"/>
          </marker>
          <marker id="activity-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#fc4c02"/>
          </marker>
        </defs>

        <rect width="960" height="600" fill="#131313"/>

        <!-- Zones are painted before connectors and nodes. -->
        <rect x="40" y="96" width="208" height="352" rx="8" fill="#161616" stroke="#353535" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="48" y="100" width="96" height="12" rx="2" fill="#131313"/>
        <text x="96" y="109" fill="#8a8a8a" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">DATA SOURCES</text>

        <rect x="280" y="72" width="400" height="416" rx="8" fill="#161616" stroke="#353535" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="288" y="76" width="88" height="12" rx="2" fill="#131313"/>
        <text x="332" y="85" fill="#8a8a8a" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">CLOUD SYNC</text>

        <rect x="704" y="112" width="216" height="272" rx="8" fill="#161616" stroke="#353535" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="712" y="116" width="80" height="12" rx="2" fill="#131313"/>
        <text x="752" y="125" fill="#8a8a8a" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.14em">STATIC SITE</text>

        <!-- Primary flows, async events, and worker-state interaction. -->
        <line x1="232" y1="168" x2="320" y2="168" stroke="#b5b5b5" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#activity-architecture-arrow)"/>
        <path d="M 232 272 H 288 Q 296 272 296 280 V 360 Q 296 368 304 368 H 320"
              fill="none" stroke="#b5b5b5" stroke-width="1.2" marker-end="url(#activity-architecture-arrow)"/>
        <path d="M 232 376 H 296 Q 304 376 304 384 V 400 Q 304 408 312 408 H 320"
              fill="none" stroke="#b5b5b5" stroke-width="1.2" marker-end="url(#activity-architecture-arrow)"/>
        <line x1="464" y1="160" x2="504" y2="160" stroke="#b5b5b5" stroke-width="1.2" marker-end="url(#activity-architecture-arrow)"/>
        <line x1="504" y1="176" x2="464" y2="176" stroke="#b5b5b5" stroke-width="1.2" marker-end="url(#activity-architecture-arrow)"/>
        <line x1="360" y1="200" x2="360" y2="240" stroke="#b5b5b5" stroke-width="1.2" marker-end="url(#activity-architecture-arrow)"/>
        <line x1="424" y1="240" x2="424" y2="200" stroke="#b5b5b5" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#activity-architecture-arrow)"/>
        <line x1="360" y1="304" x2="360" y2="352" stroke="#b5b5b5" stroke-width="1.2" marker-end="url(#activity-architecture-arrow)"/>
        <path d="M 632 400 H 680 Q 688 400 688 392 V 216 Q 688 208 696 208 H 744"
              fill="none" stroke="#fc4c02" stroke-width="1.4" marker-end="url(#activity-architecture-arrow-accent)"/>
        <line x1="820" y1="240" x2="820" y2="296" stroke="#b5b5b5" stroke-width="1.2" marker-end="url(#activity-architecture-arrow)"/>

        <!-- Connector labels. -->
        <rect x="248" y="146" width="48" height="16" rx="2" fill="#131313"/>
        <text x="272" y="158" fill="#b5b5b5" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">EVENT</text>

        <rect x="304" y="205" width="48" height="16" rx="2" fill="#131313"/>
        <text x="328" y="217" fill="#b5b5b5" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DISPATCH</text>

        <rect x="432" y="205" width="32" height="16" rx="2" fill="#131313"/>
        <text x="448" y="217" fill="#b5b5b5" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ACK</text>

        <rect x="632" y="292" width="48" height="16" rx="2" fill="#131313"/>
        <text x="656" y="304" fill="#fc4c02" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DOCS</text>

        <rect x="828" y="252" width="76" height="16" rx="2" fill="#131313"/>
        <text x="866" y="264" fill="#b5b5b5" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HTML / JSON</text>

        <!-- External data sources -->
        <rect x="64" y="136" width="168" height="64" rx="6" fill="#131313"/>
        <rect x="64" y="136" width="168" height="64" rx="6" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1"/>
        <rect x="72" y="144" width="36" height="12" rx="2" fill="none" stroke="#5b5b5b" stroke-width="0.8"/>
        <text x="90" y="153" fill="#b5b5b5" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
        <text x="148" y="176" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Strava</text>
        <text x="148" y="192" fill="#b5b5b5" font-size="9" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle">ACTIVITY SOURCE</text>

        <rect x="64" y="240" width="168" height="64" rx="6" fill="#131313"/>
        <rect x="64" y="240" width="168" height="64" rx="6" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1"/>
        <rect x="72" y="248" width="36" height="12" rx="2" fill="none" stroke="#5b5b5b" stroke-width="0.8"/>
        <text x="90" y="257" fill="#b5b5b5" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
        <text x="148" y="280" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Intervals.icu</text>
        <text x="148" y="296" fill="#b5b5b5" font-size="9" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle">LOAD / GEAR / PB</text>

        <rect x="64" y="344" width="168" height="64" rx="6" fill="#131313"/>
        <rect x="64" y="344" width="168" height="64" rx="6" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1"/>
        <rect x="72" y="352" width="36" height="12" rx="2" fill="none" stroke="#5b5b5b" stroke-width="0.8"/>
        <text x="90" y="361" fill="#b5b5b5" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
        <text x="148" y="384" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">已保存的 COROS 组数</text>
        <text x="148" y="400" fill="#b5b5b5" font-size="9" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle">STRENGTH SETS</text>

        <!-- Worker is the primary integration point. -->
        <rect x="320" y="136" width="144" height="64" rx="6" fill="#131313"/>
        <rect x="320" y="136" width="144" height="64" rx="6" fill="#2c170d" stroke="#fc4c02" stroke-width="1.2"/>
        <rect x="328" y="144" width="48" height="12" rx="2" fill="none" stroke="#a33a10" stroke-width="0.8"/>
        <text x="352" y="153" fill="#ff8a4c" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
        <text x="392" y="176" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Cloudflare Worker</text>
        <text x="392" y="192" fill="#ff8a4c" font-size="9" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle">EVENT / BATCH</text>

        <!-- Durable Object -->
        <rect x="504" y="136" width="144" height="64" rx="6" fill="#131313"/>
        <rect x="504" y="136" width="144" height="64" rx="6" fill="#232323" stroke="#b5b5b5" stroke-width="1"/>
        <rect x="512" y="144" width="40" height="12" rx="2" fill="none" stroke="#6e6e6e" stroke-width="0.8"/>
        <text x="532" y="153" fill="#b5b5b5" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="576" y="176" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Durable Object</text>
        <text x="576" y="192" fill="#b5b5b5" font-size="9" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle">LEASE / CURSOR / TOKEN</text>

        <!-- Actions -->
        <rect x="320" y="240" width="144" height="64" rx="6" fill="#131313"/>
        <rect x="320" y="240" width="144" height="64" rx="6" fill="#1c1c1c" stroke="#6e6e6e" stroke-width="1"/>
        <rect x="328" y="248" width="48" height="12" rx="2" fill="none" stroke="#5b5b5b" stroke-width="0.8"/>
        <text x="352" y="257" fill="#b5b5b5" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ACTIONS</text>
        <text x="392" y="280" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">GitHub Actions</text>
        <text x="392" y="296" fill="#b5b5b5" font-size="9" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle">SYNC / DEPLOY / ACK</text>

        <!-- Sync and build pipeline -->
        <rect x="320" y="352" width="312" height="88" rx="6" fill="#131313"/>
        <rect x="320" y="352" width="312" height="88" rx="6" fill="#1c1c1c" stroke="#6e6e6e" stroke-width="1"/>
        <rect x="328" y="360" width="56" height="12" rx="2" fill="none" stroke="#5b5b5b" stroke-width="0.8"/>
        <text x="356" y="369" fill="#b5b5b5" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">PIPELINE</text>
        <text x="476" y="392" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">同步、构建与发布快照</text>
        <text x="476" y="414" fill="#b5b5b5" font-size="9" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle">MERGE / PB / BUILD / TEST / JSON</text>

        <!-- Static site -->
        <rect x="744" y="176" width="152" height="64" rx="6" fill="#131313"/>
        <rect x="744" y="176" width="152" height="64" rx="6" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1"/>
        <rect x="752" y="184" width="36" height="12" rx="2" fill="none" stroke="#5b5b5b" stroke-width="0.8"/>
        <text x="770" y="193" fill="#b5b5b5" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">PAGES</text>
        <text x="820" y="216" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">GitHub Pages</text>
        <text x="820" y="232" fill="#b5b5b5" font-size="9" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle">HTML / MODULES / JSON</text>

        <rect x="744" y="296" width="152" height="64" rx="20" fill="#131313"/>
        <rect x="744" y="296" width="152" height="64" rx="20" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1"/>
        <text x="820" y="328" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">浏览器</text>
        <text x="820" y="344" fill="#b5b5b5" font-size="9" font-family="'Cascadia Mono', Consolas, monospace" text-anchor="middle">DISPLAY / INTERACTION</text>

        <!-- Legend strip -->
        <line x1="40" y1="536" x2="920" y2="536" stroke="#353535" stroke-width="0.8"/>
        <text x="40" y="560" fill="#8a8a8a" font-size="8" font-family="'Cascadia Mono', Consolas, monospace" letter-spacing="0.16em">LEGEND</text>

        <rect x="160" y="550" width="24" height="12" rx="2" fill="#1c1c1c" stroke="#8a8a8a" stroke-width="1"/>
        <text x="192" y="560" fill="#b5b5b5" font-size="12" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">外部来源</text>

        <rect x="300" y="550" width="24" height="12" rx="2" fill="#1c1c1c" stroke="#6e6e6e" stroke-width="1"/>
        <text x="332" y="560" fill="#b5b5b5" font-size="12" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">云端服务</text>

        <rect x="440" y="550" width="24" height="12" rx="2" fill="#232323" stroke="#b5b5b5" stroke-width="1"/>
        <text x="472" y="560" fill="#b5b5b5" font-size="12" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">状态存储</text>

        <rect x="580" y="550" width="24" height="12" rx="2" fill="#2c170d" stroke="#fc4c02" stroke-width="1"/>
        <text x="612" y="560" fill="#b5b5b5" font-size="12" font-family="'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">重点节点</text>

        <line x1="730" y1="556" x2="766" y2="556" stroke="#b5b5b5" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#activity-architecture-arrow)"/>

  </main>
</body>
</html>
