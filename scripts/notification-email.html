<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>$subject</title>
  <style>
    :root { color-scheme: dark; }
    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
    a { text-decoration:none; }
    @media only screen and (max-width:600px) {
      .email-shell { padding:20px 12px !important; }
      .email-content { padding:28px 24px 26px !important; }
      .email-heading { font-size:30px !important; }
      .email-brand { padding:0 4px 20px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;width:100%;background-color:#111411;color:#f3f2ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <div style="display:none;font-size:1px;line-height:1px;color:#111411;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">$preheader</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#111411">
    <tr><td class="email-shell" align="center" style="padding:44px 20px;">
      <!--[if mso]><table role="presentation" width="560"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;">
        <tr><td class="email-brand" style="padding:0 6px 24px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
            <tr>
              <td style="color:#f3f2ec;font-size:16px;line-height:24px;font-weight:700;letter-spacing:1px;"><span style="color:#fc6b32;">●</span>&nbsp; 波咖茶</td>
              <td align="right" style="color:#a0a79b;font-size:11px;line-height:24px;letter-spacing:2px;">运动日志</td>
            </tr>
          </table>
        </td></tr>
        <tr><td bgcolor="#20251f" style="background-color:#20251f;border:1px solid #363e32;border-radius:18px;overflow:hidden;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
            <tr><td height="4" bgcolor="#fc6b32" style="height:4px;font-size:0;line-height:0;background-color:#fc6b32;border-radius:18px 18px 0 0;">&nbsp;</td></tr>
            <tr><td class="email-content" style="padding:36px 36px 30px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr><td style="padding:0 0 22px;">
                  <span style="display:inline-block;padding:5px 11px;border-radius:20px;background-color:$status_background;color:$status_color;font-size:12px;line-height:20px;font-weight:600;">●&nbsp; $status</span>
                </td></tr>
                <tr><td>
                  <h1 class="email-heading" style="margin:0;color:#f3f2ec;font-size:36px;line-height:1.35;font-weight:700;letter-spacing:-1px;">$title</h1>
                  <p style="margin:14px 0 28px;color:#b4bcad;font-size:14px;line-height:1.9;">$description</p>
                </td></tr>
                $diagnostic_block
                <tr><td style="padding:0 0 28px;">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                    <tr><td align="center" bgcolor="#fc6b32" style="background-color:#fc6b32;border-radius:10px;">
                      <a href="$button_url" target="_blank" style="display:block;padding:15px 20px;border:1px solid #fc6b32;border-radius:10px;color:#111411;font-size:15px;line-height:22px;font-weight:700;text-align:center;text-decoration:none;">$button_label &nbsp; ↗</a>
                    </td></tr>
                  </table>
                </td></tr>
                <tr><td style="padding:22px 0 0;border-top:1px solid #3a4235;">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                      <td valign="top" style="width:80px;padding:0 0 18px;color:#a0a99a;font-size:12px;line-height:22px;">通知时间</td>
                      <td align="right" style="padding:0 0 18px;color:#e4e9df;font-size:13px;line-height:22px;">$date<br><span style="color:#a0a99a;font-size:12px;">$time &nbsp;·&nbsp; 北京时间</span></td>
                    </tr>
                    <tr>
                      <td style="color:#a0a99a;font-size:12px;line-height:22px;">$version_label</td>
                      <td align="right" style="font-size:13px;line-height:22px;"><a href="$commit_url" target="_blank" style="color:#e4e9df;text-decoration:none;font-family:Menlo,Consolas,monospace;">$short_commit &nbsp;↗</a></td>
                    </tr>
                  </table>
                </td></tr>
                <tr><td align="center" style="padding:26px 0 0;">
                  <a href="$secondary_url" target="_blank" style="display:inline-block;padding:8px 12px;color:#b4bcad;font-size:12px;line-height:24px;text-decoration:none;">$secondary_label &nbsp;→</a>
                </td></tr>
              </table>
            </td></tr>
          </table>
        </td></tr>
        <tr><td align="center" style="padding:24px 10px 0;">
          <p style="margin:0;color:#a0a79b;font-size:12px;line-height:22px;">把每一次出发，汇成看得见的运动轨迹。</p>
          <p style="margin:8px 0 0;color:#7f8978;font-size:11px;line-height:20px;">$notice</p>
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
